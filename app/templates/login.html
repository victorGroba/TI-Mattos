{% extends 'base.html' %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow">
                <div class="card-body">
                    <h4 class="card-title text-center mb-4"></h4>
                    <form method="POST">
                        <div class="text-center mb-4">
    <img src="{{ url_for('static', filename='logo.png') }}" alt="Logo Mattos" style="max-width: 180px;">
</div>

                        {{ form.hidden_tag() }}

                        <div class="mb-3">
                            {{ form.email.label(class="form-label") }}
                            {{ form.email(class="form-control") }}
                        </div>

                        <div class="mb-3">
                            {{ form.senha.label(class="form-label") }}
                            {{ form.senha(class="form-control") }}
                        </div>

                        <div class="d-grid">
                            {{ form.submit(class="btn btn-primary") }}
                        </div>
                    </form>
                </div>
                
            </div>
        </div>
    </div>
</div>
{% endblock %}
